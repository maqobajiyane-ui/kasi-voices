name: Full-stack checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: npm install --no-audit --no-fund
      - name: Run frontend and backend tests
        run: npm test
      - name: Build frontend
        run: npm run build
